<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#56b9dc" />
    <meta name="description" content="Permainan interaktif Bahasa Arab: al-muzakkar dan al-muannath." />
    <title>التَّدْرِيبُ التَّفَاعُلِي — المُذَكَّرُ وَالمُؤَنَّثُ</title>
  </head>
  <body>
    <main id="app" aria-label="Permainan interaktif al-muzakkar dan al-muannath">
      <div id="game-container" class="is-loading" aria-busy="true">
        <div class="preloader" id="preloader" role="status" aria-live="polite">
          <div class="preloader__card">
            <div class="preloader__icon" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p class="preloader__title">جَارِي التَّحْمِيلِ</p>
            <p class="preloader__status" id="preloader-status">Memuatkan aset permainan…</p>
            <div
              class="preloader__track"
              id="preloader-progress"
              role="progressbar"
              aria-label="Kemajuan memuatkan permainan"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="preloader__bar" id="preloader-bar"></div>
            </div>
            <p class="preloader__percentage" id="preloader-percentage">0%</p>
          </div>
        </div>
      </div>
      <p class="sr-only" id="game-help">
        Gunakan tetikus atau sentuhan untuk memukul tikus. Permainan boleh dimainkan secara tegak pada telefon.
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
